@if (selectedConversation) {
  <ion-footer>
    <ion-toolbar>
      <ion-item lines="none" class="chat-input-bar">
        <ion-input
          [formControl]="messageInput"
          placeholder="Escribe un mensaje"
          (keyup.enter)="sendMessage()"
        ></ion-input>
        
        <ion-button
          fill="clear"
          class="composer-location-button"
          [disabled]="isSending"
          aria-label="Enviar ubicación"
          (click)="sendLocation()"
        >
          <ion-icon slot="icon-only" [icon]="locationIcon"></ion-icon>
        </ion-button>
        <ion-button
          slot="end"
          (click)="sendMessage()"
          [disabled]="isSending"
        >
          Enviar
        </ion-button>
      </ion-item>
    </ion-toolbar>
  </ion-footer>
}
